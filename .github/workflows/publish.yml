name: Publish

on: 
  push:
    branches:    
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Persist cache
        uses: actions/cache@v6
        id: local-dot-cache
        with:
          path: .cache
          key: ${{ runner.os }}-local-dot-cache-${{ hashFiles('**/package-lock.json') }}
      - name: Setup
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      # - name: Package version
      #   run: npm run generate-version
      - name: Generate PDF
        env:
          PII_PHONE: ${{ secrets.PII_PHONE }}
        run: npm run start
      - name: PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf-result
          path: dist/**/*.pdf
          if-no-files-found: error
